defaultLevel: L1_POINTER
defaultMaxTokens: 800
userPromptDeadlineMs: 500
failOpenOnTimeout: true
levels:
  L1_POINTER:
    maxItems: 8
    evidence: NONE
  L2_COMPACT:
    maxItems: 8
    evidence: POINTER
  L3_EVIDENCED:
    maxItems: 8
    evidence: SUMMARY
  L4_EPISODE:
    automatic: false
authorityOrder:
  - BINDING_RULE
  - ACCEPTED_DECISION
  - VERIFIED_FACT
  - REFERENCE
expansion:
  enabled: true
  tools:
    - ckl.search
    - ckl.get
    - ckl.related
    - ckl.check
